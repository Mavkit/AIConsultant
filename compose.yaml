name: el-rager

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: el-rager-api:local
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: production
    ports:
      - "${EL_RAGER_API_PORT:-3001}:3001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    stop_grace_period: 15s
