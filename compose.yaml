name: el-rager

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: el_rager
      POSTGRES_USER: el_rager
      POSTGRES_PASSWORD: "${EL_RAGER_DB_PASSWORD:-local-only-change-me}"
    ports:
      - "${EL_RAGER_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U el_rager -d el_rager"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    stop_grace_period: 30s

  migrate:
    image: postgres:18.6-alpine
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: el_rager
      PGUSER: el_rager
      PGPASSWORD: "${EL_RAGER_DB_PASSWORD:-local-only-change-me}"
    volumes:
      - ./infra/postgres/migrations:/migrations:ro
      - ./infra/postgres/seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - psql -v ON_ERROR_STOP=1 -f /migrations/001_foundation.sql && psql -v ON_ERROR_STOP=1 -f /seed/001_local_pilot.sql
    restart: "no"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: el-rager-web:local
    init: true
    environment:
      API_INTERNAL_URL: http://api:3001
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    ports:
      - "${EL_RAGER_WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    stop_grace_period: 15s

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: el-rager-api:local
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: production
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: el_rager
      PGUSER: el_rager
      PGPASSWORD: "${EL_RAGER_DB_PASSWORD:-local-only-change-me}"
    ports:
      - "${EL_RAGER_API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    stop_grace_period: 15s

volumes:
  postgres-data:
